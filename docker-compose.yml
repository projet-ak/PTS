services:
  db:
    image: postgres:17-alpine
    container_name: pts-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pts}
      POSTGRES_DB: ${POSTGRES_DB:-pts}
    # Port yayinlanmiyor: API veritabanina compose agi uzerinden db:5432
    # olarak ulasir. Sunucuda baska bir Postgres 5432'yi tutuyor olabilir ve
    # port cakismasi container'in ag kurulumunu bozar. Disaridan psql gerekirse:
    #   docker compose exec db psql -U pts -d pts
    volumes:
      - pts-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pts}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pts-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pts}:${POSTGRES_PASSWORD:-pts}@db:5432/${POSTGRES_DB:-pts}
      PTS_BIND_ADDR: 0.0.0.0:8080
      PTS_SCAN_DEBOUNCE_SECONDS: ${PTS_SCAN_DEBOUNCE_SECONDS:-30}
      PTS_ALLOWED_ORIGIN: ${PTS_ALLOWED_ORIGIN:-}
      PTS_JWT_SECRET: ${PTS_JWT_SECRET:?PTS_JWT_SECRET .env icinde tanimli olmali}
      PTS_ADMIN_USERNAME: ${PTS_ADMIN_USERNAME:-admin}
      PTS_ADMIN_PASSWORD: ${PTS_ADMIN_PASSWORD:-}
      PTS_ALLOW_ANONYMOUS_KIOSK: ${PTS_ALLOW_ANONYMOUS_KIOSK:-0}
      PTS_LOGIN_MAX_ATTEMPTS: ${PTS_LOGIN_MAX_ATTEMPTS:-3}
      PTS_LOGIN_LOCK_MINUTES: ${PTS_LOGIN_LOCK_MINUTES:-15}
      PTS_PHOTO_DIR: /data/photos
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn}
    volumes:
      # Gecis fotograflari veritabaninda degil, bu birimde birikir.
      - pts-photos:/data/photos
    ports:
      # Nginx ters proxy'si buraya baglanir; internete dogrudan acilmaz.
      - "127.0.0.1:8080:8080"

volumes:
  pts-pgdata:
  pts-photos:
